name: Deploy AKHIKHAN.RU via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: akhikhan-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            config.php
            README.md
            uploads/**
            storage/*.sqlite
            storage/*.sqlite-*
            storage/*.db

      - name: Verify production site
        shell: bash
        run: |
          set -e
          code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan.html --write-out '%{http_code}' https://akhikhan.ru/)"
          test "$code" = "200"
          grep -q "site-shell" /tmp/akhikhan.html
          echo "Akhikhan production site is reachable."
