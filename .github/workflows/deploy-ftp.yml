name: Deploy AKHIKHAN.RU via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: akhikhan-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build high-resolution logo
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/assets/akhikhan-logo.part01.b64 \
            .github/assets/akhikhan-logo.part02.b64 \
            .github/assets/akhikhan-logo.part03.b64 \
            .github/assets/akhikhan-logo.part04.b64 \
            .github/assets/akhikhan-logo.part05.b64 \
            .github/assets/akhikhan-logo.part06.b64 \
            | base64 --decode > assets/img/akhikhan-logo-hq.webp
          printf '%s  %s\n' "06f06f4e249cd0199599140ec1d97411796eefcc00c840c3e789e9a6bb741e6a" "assets/img/akhikhan-logo-hq.webp" | sha256sum -c -

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            config.php
            README.md
            uploads/**
            storage/*.sqlite
            storage/*.sqlite-*
            storage/*.db

      - name: Verify production site
        shell: bash
        run: |
          set -e
          code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan.html --write-out '%{http_code}' https://akhikhan.ru/)"
          test "$code" = "200"
          grep -q "site-shell" /tmp/akhikhan.html
          grep -q "akhikhan-logo-hq.webp" /tmp/akhikhan.html
          logo_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-logo.webp --write-out '%{http_code}' https://akhikhan.ru/assets/img/akhikhan-logo-hq.webp)"
          test "$logo_code" = "200"
          test "$(wc -c < /tmp/akhikhan-logo.webp)" -gt 50000
          echo "Akhikhan production site and high-resolution logo are reachable."
