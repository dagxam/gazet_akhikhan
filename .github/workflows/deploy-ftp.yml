name: Deploy AKHIKHAN.RU via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: akhikhan-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build high-resolution logo
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/assets/akhikhan-logo.part01.b64 \
            .github/assets/akhikhan-logo.part02.b64 \
            .github/assets/akhikhan-logo.part03.b64 \
            .github/assets/akhikhan-logo.part04.b64 \
            .github/assets/akhikhan-logo.part05.b64 \
            .github/assets/akhikhan-logo.part06.b64 \
            | base64 --decode > assets/img/akhikhan-logo-hq.webp
          printf '%s  %s\n' "06f06f4e249cd0199599140ec1d97411796eefcc00c840c3e789e9a6bb741e6a" "assets/img/akhikhan-logo-hq.webp" | sha256sum -c -

      - name: Build transparent main logo
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/assets/akhikhan-logo-transparent.part01.b64 \
            .github/assets/akhikhan-logo-transparent.part02.b64 \
            .github/assets/akhikhan-logo-transparent.part03a.b64 \
            .github/assets/akhikhan-logo-transparent.part03b.b64 \
            .github/assets/akhikhan-logo-transparent.part04.b64 \
            .github/assets/akhikhan-logo-transparent.part05.b64 \
            .github/assets/akhikhan-logo-transparent.part06a.b64 \
            .github/assets/akhikhan-logo-transparent.part06b.b64 \
            .github/assets/akhikhan-logo-transparent.part07.b64 \
            .github/assets/akhikhan-logo-transparent.part08.b64 \
            .github/assets/akhikhan-logo-transparent.part09.b64 \
            | base64 --decode > assets/img/akhikhan-logo-transparent.webp
          printf '%s  %s\n' "938e90f2288289612a47389b6e1035df01100f743c3701db383fcc483211cec3" "assets/img/akhikhan-logo-transparent.webp" | sha256sum -c -

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            config.php
            README.md
            uploads/**
            storage/*.sqlite
            storage/*.sqlite-*
            storage/*.db

      - name: Verify production site
        shell: bash
        run: |
          set -e
          code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan.html --write-out '%{http_code}' https://akhikhan.ru/)"
          if [ "$code" = "200" ]; then
            grep -q "site-shell" /tmp/akhikhan.html
          elif [ "$code" = "503" ]; then
            grep -q "maintenance-page" /tmp/akhikhan.html
          else
            echo "Unexpected production HTTP status: $code"
            exit 1
          fi
          # The active logo is configurable in the admin panel, so do not require
          # the homepage to reference one specific default filename.
          transparent_logo_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-logo-transparent.webp --write-out '%{http_code}' https://akhikhan.ru/assets/img/akhikhan-logo-transparent.webp)"
          test "$transparent_logo_code" = "200"
          test "$(wc -c < /tmp/akhikhan-logo-transparent.webp)" -gt 50000
          echo "Akhikhan production site is reachable in normal or reconstruction mode."

          if [ "$code" = "200" ]; then
            grep -q "Последние видео" /tmp/akhikhan.html && echo "check: videos ok"
            grep -q 'district-news-summary' /tmp/akhikhan.html && echo "check: district summary ok"
            grep -q 'home-news-summary' /tmp/akhikhan.html && echo "check: home summary ok"
            grep -q 'home-news-three-grid items-' /tmp/akhikhan.html && echo "check: counted news grid ok"
            grep -q 'editorial-heritage' /tmp/akhikhan.html && echo "check: heritage ok"
            grep -q 'Wikimedia Commons' /tmp/akhikhan.html && echo "check: wikimedia ok"
          fi

          fresh_home_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-documents-home.html --write-out '%{http_code}' 'https://akhikhan.ru/?deploy=documents1')"
          echo "check: fresh home HTTP $fresh_home_code"
          test "$fresh_home_code" = "200"
          grep -q 'documents.php' /tmp/akhikhan-documents-home.html && echo "check: documents link ok"
          grep -q 'Все документы' /tmp/akhikhan-documents-home.html && echo "check: all documents label ok"
          grep -q 'Документы' /tmp/akhikhan-documents-home.html && echo "check: documents menu label ok"

          documents_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-documents.html --write-out '%{http_code}' 'https://akhikhan.ru/documents.php?deploy=documents1')"
          echo "check: documents page HTTP $documents_code"
          test "$documents_code" = "200"
          grep -q 'Документы' /tmp/akhikhan-documents.html && echo "check: documents page title ok"
          grep -q 'public-documents-page' /tmp/akhikhan-documents.html && echo "check: documents page markup ok"
          echo "Public Documents page, homepage link and main-menu item verified."

          login_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-admin-login.html --write-out '%{http_code}' https://akhikhan.ru/admin/login.php)"
          test "$login_code" = "200"
          grep -q "Вход в редакцию" /tmp/akhikhan-admin-login.html

          # All legal pages must remain accessible in reconstruction mode too.
          for legal_page in privacy.php personal-data-consent.php cookies.php; do
            legal_code="$(curl --silent --show-error --location --max-time 30 --output "/tmp/akhikhan-$legal_page" --write-out '%{http_code}' "https://akhikhan.ru/$legal_page")"
            test "$legal_code" = "200"
          done
          grep -q 'Политика обработки персональных данных' /tmp/akhikhan-privacy.php
          grep -q 'Реализуемые требования и меры защиты персональных данных' /tmp/akhikhan-privacy.php
          grep -q 'Wikimedia Commons' /tmp/akhikhan-privacy.php
          grep -q 'Согласие на обработку персональных данных' /tmp/akhikhan-personal-data-consent.php
          grep -q 'Сведения о субъекте персональных данных' /tmp/akhikhan-personal-data-consent.php
          grep -q 'Политика использования cookie' /tmp/akhikhan-cookies.php
          grep -q 'Политике персональных данных' /tmp/akhikhan-admin-login.html
          if [ "$code" = "200" ]; then
            grep -q 'privacy.php' /tmp/akhikhan.html
            grep -q 'personal-data-consent.php' /tmp/akhikhan.html
            grep -q 'cookies.php' /tmp/akhikhan.html
          fi
          echo "Public privacy documents and links verified."

          right_blocks_code="$(curl --silent --show-error --max-time 30 --output /tmp/akhikhan-right-blocks.html --write-out '%{http_code}' https://akhikhan.ru/admin/right-block.php)"
          test "$right_blocks_code" = "302" -o "$right_blocks_code" = "303"
          right_blocks_location="$(curl --silent --show-error --head --max-time 30 https://akhikhan.ru/admin/right-block.php | tr -d '\r' | grep -i '^Location:' || true)"
          echo "$right_blocks_location" | grep -qi 'admin/login.php'

          security_headers="$(curl --silent --show-error --head --max-time 30 https://akhikhan.ru/ | tr -d '\r')"
          echo "$security_headers" | grep -qi '^X-Content-Type-Options: nosniff'
          echo "$security_headers" | grep -qi '^X-Frame-Options: SAMEORIGIN'
          echo "$security_headers" | grep -qi '^Content-Security-Policy:'
          echo "Homepage content, admin login and security headers verified."

          ornament_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-ornament.svg --write-out '%{http_code}' https://akhikhan.ru/assets/img/ornament-footer-premium.svg)"
          test "$ornament_code" = "200"
          test "$(wc -c < /tmp/akhikhan-ornament.svg)" -gt 7000
          grep -q 'viewBox="0 0 2048 170"' /tmp/akhikhan-ornament.svg

          public_css_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-style.css --write-out '%{http_code}' 'https://akhikhan.ru/assets/css/style.css?v=20261002-documents1')"
          test "$public_css_code" = "200"
          grep -q 'ornament-footer-premium.svg' /tmp/akhikhan-style.css
          grep -q '.privacy-notice' /tmp/akhikhan-style.css
          grep -q 'District news balanced editorial grid' /tmp/akhikhan-style.css
          grep -q '.district-magazine-side-grid.items-3' /tmp/akhikhan-style.css
          grep -q 'Homepage editorial redesign' /tmp/akhikhan-style.css
          grep -q 'Homepage compact rounded refinement' /tmp/akhikhan-style.css
          grep -q 'Public documents page + homepage link' /tmp/akhikhan-style.css
          grep -q '.home-news-summary' /tmp/akhikhan-style.css
          grep -q '.home-news-three-grid.items-1' /tmp/akhikhan-style.css
          grep -q '.editorial-heritage' /tmp/akhikhan-style.css

          search_favicon_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-favicon-search.png --write-out '%{http_code}' https://akhikhan.ru/assets/img/favicon-search.png)"
          test "$search_favicon_code" = "200"
          test "$(wc -c < /tmp/akhikhan-favicon-search.png)" -gt 1000

          privacy_js_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-app.js --write-out '%{http_code}' 'https://akhikhan.ru/assets/js/app.js?v=20261001-admin-account1')"
          test "$privacy_js_code" = "200"
          grep -q 'data-privacy-notice' /tmp/akhikhan-app.js
          grep -q 'privacyVersion' /tmp/akhikhan-app.js
          grep -q 'data-topbar-admin-account' /tmp/akhikhan-app.js
          if [ "$code" = "200" ]; then
            grep -q 'target="_blank" rel="noopener"' /tmp/akhikhan.html
            grep -q 'Вход в редакцию' /tmp/akhikhan.html
          fi
          echo "Public styles, privacy banner assets and admin topbar behavior verified."

          robots_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-robots.txt --write-out '%{http_code}' https://akhikhan.ru/robots.txt)"
          test "$robots_code" = "200"
          grep -q '^Sitemap: https://akhikhan.ru/sitemap.xml' /tmp/akhikhan-robots.txt
          grep -q '^Sitemap: https://akhikhan.ru/news-sitemap.xml' /tmp/akhikhan-robots.txt

          if [ "$code" = "200" ]; then
            grep -q '<link rel="canonical" href="https://akhikhan.ru/' /tmp/akhikhan.html
            grep -q '<meta name="description"' /tmp/akhikhan.html
            grep -q '<meta property="og:site_name"' /tmp/akhikhan.html
            grep -q '<meta property="og:image:secure_url"' /tmp/akhikhan.html
            grep -q '<meta name="twitter:image:alt"' /tmp/akhikhan.html
            grep -q '<link rel="sitemap" type="application/xml"' /tmp/akhikhan.html
            grep -q '<link rel="icon"' /tmp/akhikhan.html
            grep -q 'application/ld+json' /tmp/akhikhan.html
            grep -q '"@type":"WebSite"' /tmp/akhikhan.html

            sitemap_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-sitemap.xml --write-out '%{http_code}' https://akhikhan.ru/sitemap.xml)"
            test "$sitemap_code" = "200"
            grep -q 'xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"' /tmp/akhikhan-sitemap.xml
            grep -q 'xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"' /tmp/akhikhan-sitemap.xml
            grep -q '<loc>https://akhikhan.ru/</loc>' /tmp/akhikhan-sitemap.xml
            grep -q '<loc>https://akhikhan.ru/documents.php</loc>' /tmp/akhikhan-sitemap.xml

            article_url="$(grep -oE '<loc>https://akhikhan\.ru/article/[^<]+' /tmp/akhikhan-sitemap.xml | head -n 1 | sed 's#<loc>##' || true)"
            if [ -n "$article_url" ]; then
              article_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-article.html --write-out '%{http_code}' "$article_url")"
              test "$article_code" = "200"
              grep -q '"@type":"NewsArticle"' /tmp/akhikhan-article.html
              grep -q '<meta property="article:published_time"' /tmp/akhikhan-article.html
              grep -q '<meta property="article:section"' /tmp/akhikhan-article.html
            fi

            news_sitemap_code="$(curl --silent --show-error --location --max-time 30 --output /tmp/akhikhan-news-sitemap.xml --write-out '%{http_code}' https://akhikhan.ru/news-sitemap.xml)"
            test "$news_sitemap_code" = "200"
            grep -q 'xmlns:news="http://www.google.com/schemas/sitemap-news/0.9"' /tmp/akhikhan-news-sitemap.xml
            echo "SEO metadata, robots.txt and XML sitemaps verified."
          fi
