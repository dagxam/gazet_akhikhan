name: Staging load profile

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Parallel workers (1-50)"
        required: true
        default: "10"
      duration:
        description: "Duration in seconds (10-180)"
        required: true
        default: "45"

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run safe staging load profile
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          LOAD_CONCURRENCY: ${{ inputs.concurrency }}
          LOAD_DURATION: ${{ inputs.duration }}
          LOAD_TIMEOUT: "10"
        run: python3 tests/load/staging_load.py
